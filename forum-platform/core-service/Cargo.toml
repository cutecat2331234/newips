[package]
name = "forum-core"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.7", features = ["headers", "http2", "ws"] }
tokio = { version = "1", features = ["full"] }
redis = { version = "0.24", features = ["tokio-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
bytes = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }