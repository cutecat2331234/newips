apiVersion: v1
kind: ConfigMap
metadata:
  name: core-config
  namespace: forum-platform
data:
  REDIS_URL: redis://redis:6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-service
  namespace: forum-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: core-service
  template:
    metadata:
      labels:
        app: core-service
    spec:
      containers:
        - name: core-service
          image: forum-core-service:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: core-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            timeoutSeconds: 3
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: core-service
  namespace: forum-platform
spec:
  type: ClusterIP
  selector:
    app: core-service
  ports:
    - port: 3002
      targetPort: 3002