apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: forum-platform
data:
  NODE_ENV: production
  DATABASE_URL: postgres://forum_user:forum_password@postgres:5432/forum_db
  REDIS_URL: redis://redis:6379
  RABBITMQ_URL: amqp://forum_user:forum_password@rabbitmq:5672/forum

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: forum-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api-service
          image: forum-api-service:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            timeoutSeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            timeoutSeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: forum-platform
spec:
  type: ClusterIP
  selector:
    app: api-service
  ports:
    - port: 3001
      targetPort: 3001